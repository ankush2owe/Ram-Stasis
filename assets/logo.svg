<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">RamStasis logo</title>
  <desc id="desc">A cyan hexagonal cryo-RAM chip with a glowing stasis pause emblem.</desc>
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152238"/>
      <stop offset="1" stop-color="#0B111C"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFFAFE"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="44" fill="#070C14"/>

  <g filter="url(#glow)">
    <path d="M128 18 L222 72 L222 184 L128 238 L34 184 L34 72 Z"
          fill="url(#slate)" stroke="url(#cyan)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M128 33 L209 80 L209 176 L128 223 L47 176 L47 80 Z"
          fill="none" stroke="#22D3EE" stroke-opacity="0.72" stroke-width="2.4" stroke-linejoin="round"/>
  </g>

  <g fill="#38BDF8" filter="url(#soft)">
    <g>
      <rect x="79" y="78" width="27" height="7" rx="3.5"/>
      <rect x="69" y="78" width="10" height="7" rx="3.5"/>
      <rect x="79" y="100" width="27" height="7" rx="3.5"/>
      <rect x="69" y="100" width="10" height="7" rx="3.5"/>
      <rect x="79" y="122" width="27" height="7" rx="3.5"/>
      <rect x="69" y="122" width="10" height="7" rx="3.5"/>
    </g>
    <g>
      <rect x="150" y="78" width="27" height="7" rx="3.5"/>
      <rect x="177" y="78" width="10" height="7" rx="3.5"/>
      <rect x="150" y="100" width="27" height="7" rx="3.5"/>
      <rect x="177" y="100" width="10" height="7" rx="3.5"/>
      <rect x="150" y="122" width="27" height="7" rx="3.5"/>
      <rect x="177" y="122" width="10" height="7" rx="3.5"/>
    </g>
    <g>
      <rect x="93" y="58" width="7" height="22" rx="3.5"/>
      <rect x="93" y="48" width="7" height="10" rx="3.5"/>
      <rect x="115" y="58" width="7" height="22" rx="3.5"/>
      <rect x="115" y="48" width="7" height="10" rx="3.5"/>
      <rect x="137" y="58" width="7" height="22" rx="3.5"/>
      <rect x="137" y="48" width="7" height="10" rx="3.5"/>
    </g>
    <g>
      <rect x="93" y="176" width="7" height="22" rx="3.5"/>
      <rect x="93" y="198" width="7" height="10" rx="3.5"/>
      <rect x="115" y="176" width="7" height="22" rx="3.5"/>
      <rect x="115" y="198" width="7" height="10" rx="3.5"/>
      <rect x="137" y="176" width="7" height="22" rx="3.5"/>
      <rect x="137" y="198" width="7" height="10" rx="3.5"/>
    </g>
  </g>

  <rect x="90" y="70" width="76" height="76" rx="13" fill="url(#die)" stroke="#475569" stroke-width="3"/>
  <path d="M105 85 v-6 h14 M151 85 v-6 h-14 M105 131 v6 h14 M151 131 v6 h-14"
        fill="none" stroke="#E2E8F0" stroke-opacity="0.82" stroke-width="2.2" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <rect x="112" y="92" width="11" height="32" rx="5" fill="url(#bar)"/>
    <rect x="133" y="92" width="11" height="32" rx="5" fill="url(#bar)"/>
  </g>

  <rect x="52" y="56" width="152" height="144" rx="20" fill="none" stroke="#06B6D4" stroke-opacity="0.18" stroke-width="1.4"/>
</svg>
